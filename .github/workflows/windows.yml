name: Windows build

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "assets/**", ".github/workflows/windows.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # libmpv is loaded at runtime, so building and testing don't need it
      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked
