name: Linux build

on:
  push:
    branches: [main]
    paths: ["src/**", "Cargo.toml", "Cargo.lock", "build.rs", "packaging/linux/**", ".github/workflows/linux.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # the oldest supported Ubuntu keeps the binary compatible with older glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang \
            libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libvulkan-dev libssl-dev libzstd-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: pkg
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          name="StreamTube-${version}-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/streamtube "dist/$name/"
          strip "dist/$name/streamtube"
          cp packaging/linux/streamtube.desktop packaging/linux/install.sh "dist/$name/"
          chmod +x "dist/$name/install.sh"
          cp assets/logo.png "dist/$name/streamtube.png"
          cp LICENSE README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: ${{ steps.pkg.outputs.file }}

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.pkg.outputs.file }}" --clobber
